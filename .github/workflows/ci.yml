name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint + Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go mod tidy (drift check)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  test:
    name: Tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: go test -race
        run: go test -race -timeout=5m ./internal/... ./pkg/... ./test/synthetic/...

  bench:
    name: Benchmark baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Run benchmarks
        env:
          BENCHTIME: 500ms
        run: ./scripts/bench.sh
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results.json
          retention-days: 90
